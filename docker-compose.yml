services:
  # Development service with hot reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_APP_NAME=${VITE_APP_NAME:-DtechCX}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-0.1.0}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
      - VITE_API_TIMEOUT=${VITE_API_TIMEOUT:-30000}
      - VITE_FEATURE_ANALYTICS=${VITE_FEATURE_ANALYTICS:-false}
      - VITE_FEATURE_DEBUG_MODE=${VITE_FEATURE_DEBUG_MODE:-true}
    stdin_open: true
    tty: true

  # Production-like build for testing
  preview:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_APP_NAME=${VITE_APP_NAME:-DtechCX}
        - VITE_APP_VERSION=${VITE_APP_VERSION:-0.1.0}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
        - VITE_API_TIMEOUT=${VITE_API_TIMEOUT:-30000}
        - VITE_FEATURE_ANALYTICS=${VITE_FEATURE_ANALYTICS:-false}
        - VITE_FEATURE_DEBUG_MODE=${VITE_FEATURE_DEBUG_MODE:-false}
    ports:
      - "8080:80"
